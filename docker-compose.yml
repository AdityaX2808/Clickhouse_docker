version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: <DB_USERNAME>(BY DEFAULT postgres)
      POSTGRES_PASSWORD: <DB_PASSWORD>
      POSTGRES_DB: <DB_NAME>
    ports:
      - "5432:5432"
    volumes:
      - /path/to/your/backup.sql:/docker-entrypoint-initdb.d/backup.sql
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_container
    restart: always
    environment:
      CLICKHOUSE_PASSWORD: <CLICKHOUSE_PASSWORD>
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_container
    depends_on:
      - clickhouse
      - postgres
    volumes:
      - ./app:/app
    working_dir: /app
    command: tail -f /dev/null


volumes:
  postgres_data:
  clickhouse_data:

networks:
  backend_net:
    driver: bridge